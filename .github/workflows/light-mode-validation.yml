name: Lightweight mode validation
on:
  push:
    branches: [verify/desktop-light-mode]
permissions:
  contents: read
jobs:
  desktop-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test apps/desktop/test
      - run: bun run --cwd apps/desktop typecheck
      - run: bun run --cwd apps/desktop build
      - run: bun run check:boundaries
      - run: bun run check:licenses
      - run: bun run lint
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      - name: Stand-ins for bundled assets
        working-directory: apps/desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist,src-tauri/binaries | Out-Null
          '<!doctype html>' | Set-Content dist/index.html
          foreach ($name in @('agentes-runner','agent-browser')) {
            Copy-Item "$env:WINDIR/System32/where.exe" "src-tauri/binaries/$name-x86_64-pc-windows-msvc.exe"
          }
          bun scripts/icons.ts
          bun run tauri icon app-icon-tile.png
      - name: Candidate native tests and Windows compilation
        working-directory: apps/desktop/src-tauri
        shell: pwsh
        run: |
          cargo test --lib 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/candidate.log"
          $code = $LASTEXITCODE
          if ($code -ne 0 -and $code -ne 101) { exit $code }
          exit 0
      - name: Original source comparison
        shell: pwsh
        run: |
          git fetch --depth=1 origin 58e62635d3c8e95920754e6f0d24729e8f30d498
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git restore --source=FETCH_HEAD --worktree -- apps/desktop/src-tauri
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location apps/desktop/src-tauri
          cargo test --lib 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/baseline.log"
          $code = $LASTEXITCODE
          if ($code -ne 0 -and $code -ne 101) { exit $code }
          exit 0
      - name: Require unchanged failures and passing new tests
        shell: python
        run: |
          import os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          def results(name):
              text = (root / name).read_text(encoding='utf-8-sig')
              found = dict(re.findall(r'test (\S+) \.\.\. (ok|FAILED|ignored)', text))
              assert len(found) > 80, text[-3000:]
              return found
          candidate, baseline = results('candidate.log'), results('baseline.log')
          failed = lambda r: {k for k, v in r.items() if v == 'FAILED'}
          print('Baseline failures:', sorted(failed(baseline)))
          print('Candidate failures:', sorted(failed(candidate)))
          assert failed(candidate) == failed(baseline)
          new = {k: v for k, v in candidate.items() if k.startswith('light_mode::')}
          print('New tests:', new)
          assert len(new) == 3 and set(new.values()) == {'ok'}
          print('Candidate:', len(candidate), 'Baseline:', len(baseline))
      - name: Restore candidate for cache consistency
        if: always()
        run: git restore --source=HEAD --worktree -- apps/desktop/src-tauri
  native-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: bun install --frozen-lockfile
      - name: Stand-ins for bundled assets
        working-directory: apps/desktop
        run: |
          mkdir -p dist src-tauri/binaries
          echo '<!doctype html>' > dist/index.html
          for bin in agentes-runner agent-browser; do
            install -m 755 /dev/null "src-tauri/binaries/$bin-x86_64-unknown-linux-gnu"
          done
          bun scripts/icons.ts
          bun run tauri icon app-icon-tile.png
      - name: Native unit tests and Linux compilation
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib
